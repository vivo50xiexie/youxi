<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>代号：彴约</title>
<style>
:root{
  --bg:#0f0f12;--fg:#d4d4d4;--dim:#666;--accent:#e8a84c;--dim2:#888;
  --card:#1a1a22;--card2:#222230;--border:#333;
  --green:#4caf50;--red:#e57373;--blue:#64b5f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.7;padding:20px 16px;max-width:640px;margin:0 auto;
  -webkit-font-smoothing:antialiased}
h1{font-size:22px;color:var(--accent);text-align:center;margin-bottom:4px}
.sub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:20px}
/* 面板切换 */
.panel{display:none}
.panel.active{display:block}
/* 按钮 */
.btn{display:block;width:100%;padding:14px;margin:10px 0;background:var(--card);
  color:var(--fg);border:1px solid var(--border);border-radius:8px;
  font-size:15px;cursor:pointer;transition:.2;text-align:center}
.btn:hover{background:var(--card2);border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.btn-primary:hover{background:#f0b858}
.btn-small{display:inline-block;width:auto;padding:6px 14px;font-size:13px;margin:4px}
/* 天赋选择 */
.talent-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.talent-item{background:var(--card);border:1px solid var(--border);border-radius:6px;
  padding:10px;cursor:pointer;transition:.15;font-size:13px}
.talent-item:hover{border-color:var(--accent)}
.talent-item.selected{border-color:var(--accent);background:var(--card2)}
.talent-item .t-name{font-weight:600;color:var(--fg);margin-bottom:2px}
.talent-item .t-desc{color:var(--dim);font-size:12px}
.talent-item.selected .t-name{color:var(--accent)}
/* 加点 */
.attr-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px;background:var(--card);border-radius:6px;margin:6px 0;border:1px solid var(--border)}
.attr-row .a-name{font-size:14px;font-weight:600;width:60px}
.attr-row .a-val{font-size:20px;font-weight:700;color:var(--accent);width:50px;text-align:center}
.attr-row .a-btns{display:flex;gap:6px}
.attr-btn{width:32px;height:32px;background:var(--card2);border:1px solid var(--border);
  border-radius:50%;color:var(--fg);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15}
.attr-btn:hover{border-color:var(--accent);color:var(--accent)}
.attr-btn:disabled{opacity:.3;cursor:default}
.points-info{text-align:center;color:var(--dim);font-size:13px;margin:8px 0}
.points-info span{color:var(--accent);font-weight:700;font-size:16px}
/* 游戏区 */
.game-header{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap;gap:6px}
.game-header .g-title{font-size:16px;font-weight:700;color:var(--accent)}
.game-header .g-age{font-size:13px;color:var(--dim)}
.attr-bar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin:8px 0}
.attr-mini{background:var(--card);border-radius:4px;padding:6px;text-align:center;
  border:1px solid var(--border)}
.attr-mini .am-label{font-size:10px;color:var(--dim)}
.attr-mini .am-val{font-size:16px;font-weight:700;color:var(--fg)}
.event-log{min-height:200px;max-height:400px;overflow-y:auto;margin:10px 0}
.event-entry{padding:10px;background:var(--card);border-radius:6px;margin:6px 0;
  border:1px solid var(--border);font-size:14px;animation:fadeIn .3s}
.event-entry .e-age{color:var(--accent);font-weight:700;font-size:12px;margin-bottom:4px}
.event-entry .e-text{color:var(--fg)}
.event-entry .e-choice{color:var(--dim);font-size:13px;margin-top:4px;font-style:italic}
.event-entry .e-effect{color:var(--blue);font-size:12px;margin-top:4px}
.event-entry .e-death{color:var(--red);font-weight:600}
.event-entry .e-good{color:var(--green)}
.event-entry .e-bad{color:var(--red)}
/* 事件选择 */
.choice-box{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:14px;margin:10px 0}
.choice-box .c-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px}
.choice-btn{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;
  background:var(--card2);border:1px solid var(--border);border-radius:6px;
  color:var(--fg);font-size:14px;cursor:pointer;transition:.15s}
.choice-btn:hover{border-color:var(--accent)}
.choice-btn:active{transform:scale(.98)}
/* 结算 */
.death-report{text-align:center;padding:20px 0}
.death-report .dr-age{font-size:48px;font-weight:700;color:var(--accent);margin:10px 0}
.dr-label{font-size:14px;color:var(--dim);margin:4px 0}
.dr-label span{color:var(--fg)}
.dr-tags{margin:16px 0;text-align:left}
.dr-tag{padding:8px 12px;background:var(--card);border-radius:6px;margin:6px 0;
  border:1px solid var(--border);font-size:14px}
.dr-tag .dt-key{color:var(--accent);font-weight:600;margin-right:8px}
.dr-tag .dt-val{color:var(--fg)}
.dr-recall{margin:16px 0;text-align:left}
.dr-recall-item{padding:6px 0;color:var(--dim);font-size:13px;border-left:2px solid var(--border);padding-left:12px;margin:6px 0}
.dr-remorse{margin:16px 0;padding:14px;background:var(--card);border-radius:8px;
  border:1px solid var(--border);font-size:14px;color:var(--fg)}
.dr-score{font-size:60px;font-weight:700;color:var(--accent);margin:16px 0}
.dr-score-label{font-size:14px;color:var(--dim)}
.dr-score-sub{font-size:13px;color:var(--dim);margin-top:4px}
/* 时间指示 */
.time-indicator{text-align:center;font-size:12px;color:var(--dim);margin:6px 0}
.time-indicator .t-num{color:var(--accent);font-weight:700}
/* 滚动条 */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
/* 动画 */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 1s infinite}
/* 模式切换 */
.mode-tabs{display:flex;gap:0;margin:10px 0}
.mode-tab{flex:1;text-align:center;padding:10px;background:var(--card);
  border:1px solid var(--border);color:var(--dim);font-size:14px;cursor:pointer;transition:.2s}
.mode-tab:first-child{border-radius:8px 0 0 8px}
.mode-tab:last-child{border-radius:0 8px 8px 0}
.mode-tab.active{background:var(--accent);color:#000;font-weight:600;border-color:var(--accent)}
/* 随机刷新区 */
.random-display{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:14px;margin:10px 0;min-height:80px}
.random-display .rd-label{font-size:12px;color:var(--dim);margin-bottom:8px}
.rd-items{display:flex;flex-wrap:wrap;gap:6px}
.rd-item{padding:4px 10px;background:var(--card2);border-radius:4px;
  font-size:13px;border:1px solid var(--border);color:var(--fg)}
.rd-item.rd-good{border-color:var(--green);color:var(--green)}
/* 出身选择 */
.origin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.origin-item{padding:10px;background:var(--card);border:1px solid var(--border);
  border-radius:6px;cursor:pointer;font-size:13px;transition:.15s}
.origin-item:hover{border-color:var(--accent)}
.origin-item.selected{border-color:var(--accent);background:var(--card2)}
.origin-item .o-name{font-weight:600}
.origin-item .o-desc{color:var(--dim);font-size:11px;margin-top:2px}
/* 家境显示 */
.wealth-display{margin:10px 0;padding:10px;background:var(--card);border-radius:6px;
  border:1px solid var(--border);font-size:13px;color:var(--dim)}
.wealth-display span{color:var(--accent);font-weight:600}
</style>
</head>
<body>

<h1>代号：彴约</h1>
<div class="sub">流星划过，短暂而灿烂</div>

<!-- ===== 面板1：开局 ===== -->
<div id="panel-start" class="panel active">

  <!-- 模式选择 -->
  <div style="margin-bottom:16px">
    <div style="font-size:13px;color:var(--dim);margin-bottom:6px">开局模式</div>
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="custom" onclick="switchMode('custom')">定制模式</div>
      <div class="mode-tab" data-mode="random" onclick="switchMode('random')">随机模式</div>
    </div>
  </div>

  <!-- 天赋 -->
  <div style="font-size:14px;font-weight:600;margin:14px 0 6px;color:var(--fg)">天赋</div>
  <div id="talent-custom">
    <div style="font-size:12px;color:var(--dim);margin-bottom:8px">自由勾选，无上限</div>
    <div class="talent-grid" id="talent-grid"></div>
  </div>
  <div id="talent-random" style="display:none">
    <div style="font-size:12px;color:var(--dim);margin-bottom:8px">
      随机刷新 <span id="rd-count" style="color:var(--accent)">?</span> 个天赋，接或重刷
    </div>
    <div class="random-display" id="random-talents">
      <div class="rd-label">点击下方按钮刷新</div>
      <div class="rd-items" id="rd-items"><span style="color:var(--dim);font-size:13px">尚未刷新</span></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-small" onclick="refreshRandomTalents()">刷新</button>
      <button class="btn btn-small" onclick="confirmRandomTalents()" id="btn-confirm-talents" disabled>接住</button>
    </div>
  </div>
  <div id="selected-talents-info" style="margin-top:8px;font-size:13px;color:var(--dim)"></div>

  <!-- 四维加点 -->
  <div style="font-size:14px;font-weight:600;margin:18px 0 6px;color:var(--fg)">四维属性</div>
  <div class="points-info" id="points-info">剩余 <span id="points-left">20</span> 点</div>

  <div id="attr-custom">
    <div class="attr-row">
      <div class="a-name">颜值</div>
      <div class="a-val" id="val-yanzhi">0</div>
      <div class="a-btns">
        <button class="attr-btn" onclick="changeAttr('yanzhi',-1)">-</button>
        <button class="attr-btn" onclick="changeAttr('yanzhi',1)">+</button>
      </div>
    </div>
    <div class="attr-row">
      <div class="a-name">智力</div>
      <div class="a-val" id="val-zhili">0</div>
      <div class="a-btns">
        <button class="attr-btn" onclick="changeAttr('zhili',-1)">-</button>
        <button class="attr-btn" onclick="changeAttr('zhili',1)">+</button>
      </div>
    </div>
    <div class="attr-row">
      <div class="a-name">体质</div>
      <div class="a-val" id="val-tizhi">0</div>
      <div class="a-btns">
        <button class="attr-btn" onclick="changeAttr('tizhi',-1)">-</button>
        <button class="attr-btn" onclick="changeAttr('tizhi',1)">+</button>
      </div>
    </div>
    <div class="attr-row">
      <div class="a-name">家境</div>
      <div class="a-val" id="val-jiajing">0</div>
      <div class="a-btns">
        <button class="attr-btn" onclick="changeAttr('jiajing',-1)">-</button>
        <button class="attr-btn" onclick="changeAttr('jiajing',1)">+</button>
      </div>
    </div>
  </div>

  <div id="attr-random" style="display:none">
    <div class="random-display" id="random-attrs">
      <div class="rd-label">点击下方按钮随机分配</div>
      <div class="rd-items" id="ra-items"><span style="color:var(--dim);font-size:13px">尚未分配</span></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-small" onclick="rollRandomAttrs()">随机分配</button>
      <button class="btn btn-small" onclick="confirmRandomAttrs()" id="btn-confirm-attrs" disabled>确认</button>
    </div>
  </div>

  <!-- 出身（写死在 HTML，不依赖 JS 渲染） -->
  <div style="font-size:14px;font-weight:600;margin:18px 0 6px;color:var(--fg)">出身</div>
  <div class="origin-grid" id="origin-grid">
    <div class="origin-item" id="origin-tier1" onclick="selectOrigin('tier1')">
      <div class="o-name">一线城市</div>
      <div class="o-desc">北京/上海/广深</div>
    </div>
    <div class="origin-item" id="origin-tier2" onclick="selectOrigin('tier2')">
      <div class="o-name">二线城市</div>
      <div class="o-desc">杭州/成都/武汉</div>
    </div>
    <div class="origin-item" id="origin-county" onclick="selectOrigin('county')">
      <div class="o-name">县城</div>
      <div class="o-desc">小县城</div>
    </div>
    <div class="origin-item" id="origin-rural" onclick="selectOrigin('rural')">
      <div class="o-name">农村</div>
      <div class="o-desc">乡镇/村庄</div>
    </div>
  </div>

  <!-- 家境预览 -->
  <div class="wealth-display" id="wealth-preview" style="display:none"></div>

  <button class="btn btn-primary" id="btn-start" onclick="startGame()" disabled style="margin-top:16px">
    开始人生
  </button>
  <div style="font-size:11px;color:var(--dim);text-align:center;margin-top:6px">
    现实 1 秒 = 游戏 1 天 · 彴约，流星划过
  </div>
</div>

<!-- ===== 面板2：游戏 ===== -->
<div id="panel-game" class="panel">
  <div class="game-header">
    <div>
      <div class="g-title" id="g-phase">童年</div>
      <div class="g-age" id="g-age">0 岁 0 天</div>
    </div>
    <div style="font-size:12px;color:var(--dim)" id="g-day">第 0 月</div>
  </div>
  <div class="attr-bar" id="attr-bar">
    <div class="attr-mini"><div class="am-label">颜值</div><div class="am-val" id="gb-yanzhi">0</div></div>
    <div class="attr-mini"><div class="am-label">智力</div><div class="am-val" id="gb-zhili">0</div></div>
    <div class="attr-mini"><div class="am-label">体质</div><div class="am-val" id="gb-tizhi">0</div></div>
    <div class="attr-mini"><div class="am-label">家境</div><div class="am-val" id="gb-jiajing">0</div></div>
  </div>
  <div style="display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap">
    <button class="btn btn-small btn-primary" id="btn-next" onclick="nextEvent()" style="flex:1">⏭ 下一年（出 1 个事件）</button>
    <button class="btn btn-small" id="btn-play" onclick="toggleAuto()">▶ 自动</button>
    <button class="btn btn-small" id="btn-skip" onclick="skipToOld()">⏩ 到老年</button>
  </div>
  <div class="event-log" id="event-log"></div>
  <div id="event-choice" style="display:none"></div>
  <div id="death-panel" style="display:none"></div>
</div>

<script>
// 全局错误显示：脚本若中途报错，把信息贴到页面上，避免"全页按钮失灵"
window.addEventListener("error", function(e){
  let box = document.getElementById("error-overlay");
  if(!box){
    box = document.createElement("div");
    box.id = "error-overlay";
    box.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:9999;max-width:90vw;max-height:40vh;overflow:auto;background:#2a0d0d;border:1px solid #e05252;color:#ffb4b4;font-size:11px;padding:8px;border-radius:6px;font-family:monospace;white-space:pre-wrap";
    document.body.appendChild(box);
  }
  box.textContent = "⚠ JS 错误：\n" + (e.message||"未知") + "\n" + (e.filename||"") + ":" + (e.lineno||"");
});
// ========== 天赋池（36个） ==========
const TALENTS = [
  // 基础四维
  {id:"early",name:"早慧",desc:"智力+2，童年事件选项更多",fx:{zhili:2}},
  {id:"fit",name:"身体好",desc:"体质+2，健康衰减慢",fx:{tizhi:2}},
  {id:"rich",name:"家境优渥",desc:"家境+3，但父母期待高",fx:{jiajing:3}},
  {id:"art",name:"艺术细胞",desc:"颜值+1，艺术类事件解锁特殊分支",fx:{yanzhi:1},tag:"art"},
  {id:"social",name:"社牛",desc:"颜值+1，关系类事件正面概率+",fx:{yanzhi:1},tag:"social"},
  {id:"skew",name:"偏科",desc:"智力+3，体质-1",fx:{zhili:3,tizhi:-1}},
  {id:"rebel",name:"叛逆",desc:"体质+1，青春期事件选项不同",fx:{tizhi:1},tag:"rebel"},
  {id:"nice",name:"老好人",desc:"同事关系好，职场晋升慢",fx:{},tag:"nice"},
  {id:"health",name:"养生达人",desc:"体质+2，中年健康事件正面",fx:{tizhi:2},tag:"health"},
  {id:"night",name:"夜猫子",desc:"体质-1，加班少扣体质",fx:{tizhi:-1},tag:"night"},
  {id:"top",name:"学霸",desc:"智力+3，学业事件正面",fx:{zhili:3},tag:"top"},
  {id:"shy",name:"社恐",desc:"颜值-1，关系负面，独处正面",fx:{yanzhi:-1},tag:"shy"},
  // 稀有
  {id:"star",name:"星途",desc:"颜值+3，容易走演艺圈",fx:{yanzhi:3},tag:"star",rare:true},
  {id:"genius",name:"天才",desc:"智力+4，解锁科研/创业捷径",fx:{zhili:4},tag:"genius",rare:true},
  {id:"iron",name:"铁人",desc:"体质+4，几乎不生病",fx:{tizhi:4},tag:"iron",rare:true},
  {id:"tycoon",name:"巨富投胎",desc:"家境+5，出生即富豪",fx:{jiajing:5},tag:"tycoon",rare:true},
  {id:"box",name:"神秘小盒子",desc:"活到80岁可解锁隐藏结局",fx:{},tag:"box",rare:true},
  {id:"charm",name:"万人迷",desc:"颜值+2，魅力+，事件选项更多",fx:{yanzhi:2},tag:"charm",rare:true},
  {id:"lucky",name:"锦鲤体质",desc:"所有随机事件正面概率+30%",fx:{},tag:"lucky",rare:true},
  {id:"curse",name:"命硬",desc:"体质-3，但极难死掉",fx:{tizhi:-3},tag:"curse",rare:true},
  // 中性/干扰
  {id:"lazy",name:"懒散",desc:"智力-1，但压力小",fx:{zhili:-1},tag:"lazy"},
  {id:"impulsive",name:"冲动",desc:"事件选项更少，后果更极端",fx:{},tag:"impulsive"},
  {id:"overthink",name:"想太多",desc:"体质-1，事件选择时间+2s",fx:{tizhi:-1},tag:"overthink"},
  {id:"frugal",name:"抠门",desc:"家境-1，但储蓄事件正面",fx:{jiajing:-1},tag:"frugal"},
  {id:"gamer",name:"游戏天才",desc:"智力+1，但学业-1",fx:{zhili:1},tag:"gamer"},
  {id:"athlete",name:"运动健将",desc:"体质+2，智力-1",fx:{tizhi:2,zhili:-1},tag:"athlete"},
  {id:"chef",name:"天生厨子",desc:"家境+1，生活事件正面",fx:{jiajing:1},tag:"chef"},
  {id:"writer",name:"文青",desc:"智力+1，颜值+1，但赚钱慢",fx:{zhili:1,yanzhi:1},tag:"writer"},
  {id:"business",name:"商业嗅觉",desc:"家境+2，创业事件正面",fx:{jiajing:2},tag:"business"},
  {id:"doctor",name:"医者仁心",desc:"体质+1，健康类事件正面",fx:{tizhi:1},tag:"doctor"},
  {id:"soldier",name:"兵痞",desc:"体质+2，颜值-1，关系事件负面",fx:{tizhi:2,yanzhi:-1},tag:"soldier"},
  {id:"dancer",name:"舞林高手",desc:"体质+1，颜值+2，艺术事件正面",fx:{tizhi:1,yanzhi:2},tag:"dancer"},
  {id:"poor",name:"穷小子",desc:"家境-2，但逆袭事件正面",fx:{jiajing:-2},tag:"poor"},
  {id:"prince",name:"富二代",desc:"家境+4，但人生缺乏动力",fx:{jiajing:4},tag:"prince"},
  {id:"orphan",name:"孤儿",desc:"家境-2，关系事件负面，但独立+3",fx:{jiajing:-2},tag:"orphan"},
  {id:"twins",name:"双胞胎",desc:"关系(兄弟姐妹)+20，事件选项不同",fx:{},tag:"twins"},
];

// ========== 出身 ==========
const ORIGINS = [

// ========== 状态 ==========
let state = {
  mode: "custom",
  selectedTalents: [],
  randomTalentRefresh: null,
  confirmedRandomTalents: false,
  confirmedRandomAttrs: false,
  attrs: {yanzhi:0, zhili:0, tizhi:0, jiajing:0},
  attrPointsUsed: 0,
  origin: null,
  wealthLevel: null,
  // 游戏状态
  month: 0,
  age: 0,
  phase: "child",

  autoPlay: false,
  speed: 1,
  autoTimer: null,

  pendingEvent: null,
  eventLog: [],
  keyEvents: [],
  remorse: 0,
  gameOver: false,
  deathDay: 0,
  timer: null,
  speed: 1000, // 1秒=1天
};

// ========== 初始化 ==========
function init(){
  try{ renderTalents(); }catch(e){ console.error("talent render:",e); }
  try{ updatePointsInfo(); }catch(e){ console.error("points:",e); }
  // 出身选项已写死在 HTML，无需 renderOrigins
}

function renderTalents(){
  const grid = document.getElementById("talent-grid");
  grid.innerHTML = TALENTS.map(t=>{
    const rare = t.rare ? '<span style="color:var(--accent);font-size:11px">★</span>' : '';
    return `<div class="talent-item" id="tal-${t.id}" onclick="toggleTalent('${t.id}')">
      <div class="t-name">${rare} ${t.name}</div>
      <div class="t-desc">${t.desc}</div>
    </div>`;
  }).join("");
}

function renderOrigins(){
  const grid = document.getElementById("origin-grid");
  grid.innerHTML = ORIGINS.map(o=>{
    return `<div class="origin-item" id="origin-${o.id}" onclick="selectOrigin('${o.id}')">
      <div class="o-name">${o.name}</div>
      <div class="o-desc">${o.desc}</div>
    </div>`;
  }).join("");
}

function toggleTalent(id){
  const idx = state.selectedTalents.indexOf(id);
  if(idx>=0) state.selectedTalents.splice(idx,1);
  else state.selectedTalents.push(id);
  updateTalentUI();
  updateStartBtn();
}

function updateTalentUI(){
  TALENTS.forEach(t=>{
    const el = document.getElementById("tal-"+t.id);
    if(el) el.className = "talent-item" + (state.selectedTalents.includes(t.id)?" selected":"");
  });
  const info = document.getElementById("selected-talents-info");
  info.textContent = state.selectedTalents.length>0 ? "已选 "+state.selectedTalents.length+" 个天赋" : "";
  checkStartReady();
}

function selectOrigin(id){
  document.querySelectorAll(".origin-item").forEach(e=>e.classList.remove("selected"));
  document.getElementById("origin-"+id).classList.add("selected");
  state.origin = ORIGINS.find(o=>o.id===id);
  updateWealthPreview();
  checkStartReady();
}

function updateWealthPreview(){
  const el = document.getElementById("wealth-preview");
  if(state.origin){
    const jl = state.attrs.jiajing;
    let level;
    if(jl>=10) level = "巨富";
    else if(jl>=8) level = "富裕";
    else if(jl>=5) level = "小康";
    else if(jl>=3) level = "温饱";
    else level = "贫穷";
    const wl = WEALTH_LEVELS.find(w=>w.name===level);
    el.style.display = "block";
    el.innerHTML = `家境等级：<span>${level}</span> · 年收入参考：<span>${wl?wl.income:"?"}</span> · 出生地：<span>${state.origin.name}</span>`;
  } else {
    el.style.display = "none";
  }
}

// ========== 模式切换 ==========
function switchMode(mode){
  state.mode = mode;
  document.querySelectorAll(".mode-tab").forEach(t=>{
    t.classList.toggle("active", t.dataset.mode===mode);
  });
  document.getElementById("talent-custom").style.display = mode==="custom"?"block":"none";
  document.getElementById("talent-random").style.display = mode==="random"?"block":"none";
  document.getElementById("attr-custom").style.display = mode==="custom"?"block":"none";
  document.getElementById("attr-random").style.display = mode==="random"?"block":"none";
  document.getElementById("points-info").style.display = mode==="custom"?"block":"none";
  if(mode==="random"){
    state.confirmedRandomTalents = false;
    state.confirmedRandomAttrs = false;
    document.getElementById("btn-confirm-talents").disabled = true;
    document.getElementById("btn-confirm-attrs").disabled = true;
  }
  checkStartReady();
}

function refreshRandomTalents(){
  const poolSize = TALENTS.length;
  const count = Math.round(poolSize * (0.3 + Math.random()*0.2));
  const shuffled = [...TALENTS].sort(()=>Math.random()-0.5);
  state.randomTalentRefresh = shuffled.slice(0,count);
  document.getElementById("rd-count").textContent = count;
  const items = document.getElementById("rd-items");
  items.innerHTML = state.randomTalentRefresh.map(t=>{
    const cls = t.rare ? "rd-item rd-good" : "rd-item";
    return `<span class="${cls}">${t.name}</span>`;
  }).join("");
  document.getElementById("btn-confirm-talents").disabled = false;
}

function confirmRandomTalents(){
  if(!state.randomTalentRefresh) return;
  state.selectedTalents = state.randomTalentRefresh.map(t=>t.id);
  state.confirmedRandomTalents = true;
  updateTalentUI();
  document.getElementById("btn-confirm-talents").disabled = true;
  checkStartReady();
}

function rollRandomAttrs(){
  const total = Math.floor(Math.random()*41); // 0~40
  const keys = ["yanzhi","zhili","tizhi","jiajing"];
  const vals = [0,0,0,0];
  let remaining = total;
  for(let i=0;i<total;i++){
    const free = keys.filter((_,idx)=>vals[idx]<10);
    if(free.length===0) break;
    const pick = free[Math.floor(Math.random()*free.length)];
    vals[keys.indexOf(pick)]++;
  }
  state.attrs = {yanzhi:vals[0],zhili:vals[1],tizhi:vals[2],jiajing:vals[3]};
  document.getElementById("ra-items").innerHTML =
    `<span class="rd-item">颜值 ${vals[0]}</span>`+
    `<span class="rd-item">智力 ${vals[1]}</span>`+
    `<span class="rd-item">体质 ${vals[2]}</span>`+
    `<span class="rd-item">家境 ${vals[3]}</span>`+
    `<span class="rd-item" style="color:var(--accent)">共 ${total} 点</span>`;
  document.getElementById("btn-confirm-attrs").disabled = false;
}

function confirmRandomAttrs(){
  state.confirmedRandomAttrs = true;
  document.getElementById("btn-confirm-attrs").disabled = true;
  // 显示到UI
  document.getElementById("val-yanzhi").textContent = state.attrs.yanzhi;
  document.getElementById("val-zhili").textContent = state.attrs.zhili;
  document.getElementById("val-tizhi").textContent = state.attrs.tizhi;
  document.getElementById("val-jiajing").textContent = state.attrs.jiajing;
  checkStartReady();
}

// ========== 加点（定制模式） ==========
function changeAttr(key,delta){
  const max = 10;
  const newVal = state.attrs[key]+delta;
  if(delta>0 && newVal>max) return;
  if(delta<0 && newVal<0) return;
  // 检查点数
  if(delta>0 && state.attrPointsUsed>=20) return;
  if(delta>0) state.attrPointsUsed++;
  if(delta<0) state.attrPointsUsed--;
  state.attrs[key] = newVal;
  document.getElementById("val-"+key).textContent = newVal;
  updatePointsInfo();
  updateWealthPreview();
  checkStartReady();
}

function updatePointsInfo(){
  const left = 20-state.attrPointsUsed;
  document.getElementById("points-left").textContent = left;
}

function checkStartReady(){
  const btn = document.getElementById("btn-start");
  let ready = false;
  let hint = "";
  if(state.mode==="custom"){
    ready = state.origin!==null;
    hint = ready ? "" : "请选择出身";
  } else {
    const need = [];
    if(!state.confirmedRandomTalents) need.push("确认天赋");
    if(!state.confirmedRandomAttrs) need.push("确认属性");
    if(state.origin===null) need.push("选择出身");
    ready = need.length===0;
    hint = ready ? "" : "还差：" + need.join("、");
  }
  btn.disabled = !ready;
  btn.textContent = ready ? "开始人生" : hint;
}

function updateStartBtn(){checkStartReady()}

// ========== 开始游戏 ==========
function startGame(){
  // 应用天赋效果到四维
  state.selectedTalents.forEach(tid=>{
    const t = TALENTS.find(x=>x.id===tid);
    if(t&&t.fx){
      Object.keys(t.fx).forEach(k=>{
        state.attrs[k] = Math.max(0,Math.min(10, state.attrs[k]+t.fx[k]));
      });
    }
  });
  // 显示最终四维
  document.getElementById("val-yanzhi").textContent = state.attrs.yanzhi;
  document.getElementById("val-zhili").textContent = state.attrs.zhili;
  document.getElementById("val-tizhi").textContent = state.attrs.tizhi;
  document.getElementById("val-jiajing").textContent = state.attrs.jiajing;
  document.getElementById("gb-yanzhi").textContent = state.attrs.yanzhi;
  document.getElementById("gb-zhili").textContent = state.attrs.zhili;
  document.getElementById("gb-tizhi").textContent = state.attrs.tizhi;
  document.getElementById("gb-jiajing").textContent = state.attrs.jiajing;

  // 出生
  state.month = 0;
  state.age = 0;
  state.phase = "child";
  state.pendingEvent = null;
  state.remorse = 0;
  state.eventLog = [];
  state.keyEvents = [];
  state.gameOver = false;
  state.autoPlay = false;
  state.fastForward = false;

  document.getElementById("panel-start").classList.remove("active");
  document.getElementById("panel-game").classList.add("active");
  // 重置控制按钮
  document.getElementById("event-choice").style.display = "none";
  document.getElementById("btn-play").textContent = "▶ 自动播放";
  document.getElementById("btn-play").classList.remove("btn-primary");
  document.getElementById("btn-next").disabled = false;
  document.getElementById("btn-skip").disabled = false;

  addEventLog("🍼 你出生了。",`出身：${state.origin?state.origin.name:"随机"} · 家境 ${state.attrs.jiajing} · 颜值 ${state.attrs.yanzhi} · 智力 ${state.attrs.zhili} · 体质 ${state.attrs.tizhi}`);
  state.keyEvents.push({age:0,text:"你出生了。"});
  updateGameUI();
  // 默认手动：点"⏭ 下一个"推进 1 年并出 1 个事件
}

// ===== 手动驱动：点一下 = 推进 1 年，这一年出 1 个事件 =====

// 点一次推进的"年数"：默认 1 年（可选快进）
function yearsPerEvent(){
  return state.fastForward ? 5 : 1;
}

// 前进到下一个事件时刻（每次 1 年）
function advanceTime(){
  const years = yearsPerEvent();
  state.age += years;
  // 阶段转换
  const newPhase = state.age>=61?"old":state.age>=36?"middle":state.age>=19?"young":state.age>=13?"teen":"child";
  if(newPhase!==state.phase){
    const names={child:"童年",teen:"少年",young:"青年",middle:"中年",old:"老年"};
    addEventLog("—— "+names[newPhase]+"期 ——");
    state.phase=newPhase;
  }
}

// 抽一个当前年龄合适、没玩过的事件
function pickEvent(){
  const inAge = e => !e.age || (state.age>=e.age[0] && state.age<=e.age[1]);
  let pool;
  if(state.age < 6){
    pool = EVENTS.filter(e=>e.phase==="child" && inAge(e) && (!e.age || e.age[0]<=state.age));
    if(pool.length===0) pool = EVENTS.filter(e=>e.phase==="child" && inAge(e));
  } else {
    pool = EVENTS.filter(e=>e.phase===state.phase && inAge(e));
    if(pool.length===0) pool = EVENTS.filter(e=>inAge(e));
    if(pool.length===0) pool = EVENTS.filter(e=>e.phase==="all");
  }
  if(!pool || pool.length===0) return null;
  const seen = new Set(state.eventLog.map(l=>l.eventId));
  const avail = pool.filter(e=>!seen.has(e.id));
  const src = avail.length ? avail : pool;
  return src[Math.floor(Math.random()*src.length)];
}

// 主推进：前进时间 → 出事件 → （自动或手动选择）
function nextEvent(){
  if(state.gameOver) return;
  advanceTime();
  const event = pickEvent();
  if(!event){ updateGameUI(); return; }

  state.pendingEvent = event;
  addEventLog(`[${state.age} 岁] ${event.text}`);

  // 自动模式：随机选 + 排下一次
  if(state.autoPlay){
    autoChoose(event);
  } else {
    // 手动模式：弹出选项让玩家选（选完点"下一年"才继续）
    showChoices(event);
  }
  updateGameUI();
}

// 显示选项按钮（手动模式）
function showChoices(event){
  const box = document.getElementById("event-choice");
  box.style.display = "block";
  box.innerHTML = `<div class="choice-box">
    <div class="c-title">[${state.age} 岁] ${event.text}</div>
    ${event.choices.map((c,i)=>`<button class="choice-btn" onclick="chooseOption(${i})">${String.fromCharCode(65+i)}. ${c.text}</button>`).join("")}
  </div>`;
  document.getElementById("event-log").scrollTop = document.getElementById("event-log").scrollHeight;
}

// 自动模式：随机选一个选项并记录
function autoChoose(event){
  const choice = event.choices[Math.floor(Math.random()*event.choices.length)];
  applyChoice(choice, event);
  scheduleAuto();
}

// 手动选择
function chooseOption(idx){
  const event = state.pendingEvent;
  const choice = event.choices[idx];
  document.getElementById("event-choice").style.display = "none";
  applyChoice(choice, event);
  checkDeath();
  updateGameUI();
}

// 应用一个选项的效果（自动/手动共用）
function applyChoice(choice, event){
  const fx = choice.fx || {};
  let effects = [];
  if(fx.yanzhi){ state.attrs.yanzhi = clamp0_10(state.attrs.yanzhi+fx.yanzhi); effects.push("颜值"+fmt(fx.yanzhi)); }
  if(fx.zhili){ state.attrs.zhili = clamp0_10(state.attrs.zhili+fx.zhili); effects.push("智力"+fmt(fx.zhili)); }
  if(fx.tizhi){ state.attrs.tizhi = clamp0_10(state.attrs.tizhi+fx.tizhi); effects.push("体质"+fmt(fx.tizhi)); }
  if(fx.jiajing){ state.attrs.jiajing = clamp0_10(state.attrs.jiajing+fx.jiajing); effects.push("家境"+fmt(fx.jiajing)); }
  if(fx.remorse){ state.remorse = Math.max(0,state.remorse+fx.remorse); effects.push("遗憾"+fmt(fx.remorse)); }
  state.eventLog.push({age:state.age,text:event.text,choice:choice.text,eventId:event.id});
  state.keyEvents.push({age:state.age,text:`${event.text} 你选了：${choice.text}`});
  addEventLog(`你选了：${choice.text}`, effects.join(" · "), choice.good===false);
  state.pendingEvent = null;
}

function fmt(n){ return (n>0?"+":"")+n; }
function clamp0_10(v){ return Math.max(0,Math.min(10,v)); }

// ===== 自动播放循环（人生重开式"看小说"体验）=====
// 每次推进一个事件后，按当前速度的"事件间隔毫秒"再触发下一次
function scheduleAuto(){
  if(state.gameOver || !state.autoPlay) return;
  clearAuto();
  // 一个事件的基础间隔 1.2 秒，按 speed 缩放；老年/幼年稍慢
  const baseMs = state.age>=60 ? 2000 : state.age<6 ? 800 : 1200;
  const delay = baseMs / state.speed;
  state.autoTimer = setTimeout(()=>{
    nextEvent();
  }, delay);
}

function toggleAuto(){
  state.autoPlay = !state.autoPlay;
  const btn = document.getElementById("btn-play");
  btn.textContent = state.autoPlay ? "⏸ 暂停" : "▶ 自动播放";
  btn.classList.toggle("btn-primary", state.autoPlay);
  if(state.autoPlay){
    // 先清掉手动选项框
    document.getElementById("event-choice").style.display = "none";
    scheduleAuto();
  } else {
    clearAuto();
  }
}

function clearAuto(){
  if(state.autoTimer){ clearTimeout(state.autoTimer); state.autoTimer=null; }
}

function setSpeed(s){
  state.speed = s;
  ["sp1","sp2","sp4"].forEach(id=>document.getElementById(id).classList.remove("btn-primary"));
  document.getElementById("sp"+s).classList.add("btn-primary");
  // 若正在自动播放，重排下一次
  if(state.autoPlay && !state.gameOver) scheduleAuto();
}

// 快进到老年（跳过中间阶段）
function skipToOld(){
  if(state.gameOver) return;
  clearAuto();
  state.autoPlay = false;
  document.getElementById("btn-play").textContent = "▶ 自动播放";
  document.getElementById("btn-play").classList.remove("btn-primary");
  // 直接跳到 60 岁
  state.age = 60; state.month = 0; state.phase = "old";
  addEventLog("⏩ 快进到 60 岁（老年）");
  updateGameUI();
  nextEvent();
}

function chooseOption(idx){
  const event = state.pendingEvent;
  const choice = event.choices[idx];
  const fx = choice.fx || {};

  // 应用效果
  let effects = [];
  if(fx.yanzhi !== 0 && fx.yanzhi !== undefined){
    state.attrs.yanzhi = Math.max(0,Math.min(10,state.attrs.yanzhi+fx.yanzhi));
    effects.push("颜值"+(fx.yanzhi>0?"+":"")+fx.yanzhi);
  }
  if(fx.zhili !== 0 && fx.zhili !== undefined){
    state.attrs.zhili = Math.max(0,Math.min(10,state.attrs.zhili+fx.zhili));
    effects.push("智力"+(fx.zhili>0?"+":"")+fx.zhili);
  }
  if(fx.tizhi !== 0 && fx.tizhi !== undefined){
    state.attrs.tizhi = Math.max(0,Math.min(10,state.attrs.tizhi+fx.tizhi));
    effects.push("体质"+(fx.tizhi>0?"+":"")+fx.tizhi);
  }
  if(fx.jiajing !== 0 && fx.jiajing !== undefined){
    state.attrs.jiajing = Math.max(0,Math.min(10,state.attrs.jiajing+fx.jiajing));
    effects.push("家境"+(fx.jiajing>0?"+":"")+fx.jiajing);
  }
  if(fx.remorse !== 0 && fx.remorse !== undefined){
    state.remorse = Math.max(0,state.remorse+fx.remorse);
    effects.push("遗憾"+(fx.remorse>0?"+":"")+fx.remorse);
  }

  // 更新UI
  document.getElementById("gb-yanzhi").textContent = state.attrs.yanzhi;
  document.getElementById("gb-zhili").textContent = state.attrs.zhili;
  document.getElementById("gb-tizhi").textContent = state.attrs.tizhi;
  document.getElementById("gb-jiajing").textContent = state.attrs.jiajing;

  // 记录
  state.eventLog.push({age:state.age,text:event.text,choice:choice.text,eventId:event.id});
  state.keyEvents.push({age:state.age,text:`${event.text} 你选了：${choice.text}`});

  addEventLog(`你选了：${choice.text}`, effects.join(" · "), choice.good===false);

  // 清除选择
  document.getElementById("event-choice").style.display = "none";
  state.pendingEvent = null;
  document.getElementById("btn-next").disabled = false;

  // 检查是否该死了
  checkDeath();

  updateGameUI();
}

function addEventLog(text, effects, bad){
  const log = document.getElementById("event-log");
  const div = document.createElement("div");
  div.className = "event-entry";
  let html = `<div class="e-age">${state.age} 岁</div>`;
  html += `<div class="e-text ${bad?"e-bad":""}">${text}</div>`;
  if(effects) html += `<div class="e-effect ${bad?"e-bad":""}">${effects}</div>`;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function checkDeath(){
  // 体质0 且年龄>10
  if(state.attrs.tizhi<=0 && state.age>10){
    die();
    return;
  }
  // 自然寿命：体质越高活越久
  // 基础75岁 + 体质*1.5（最高90）+ 随机0~5
  const maxAge = 75 + state.attrs.tizhi*1.5 + Math.floor(Math.random()*6);
  if(state.age >= maxAge && Math.random() < 0.3){
    die();
    return;
  }
  // 80岁后每年加速衰老
  if(state.age >= 80){
    const chance = (state.age-75)*0.06 + (10-state.attrs.tizhi)*0.02;
    if(Math.random() < chance){
      die();
    }
  }
}

function die(){
  state.gameOver = true;
  state.deathDay = state.month;
  clearAuto();
  state.autoPlay = false;
  document.getElementById("btn-play").textContent = "▶ 自动播放";
  document.getElementById("btn-play").classList.remove("btn-primary");
  showDeathReport();
}

function updateGameUI(){
  document.getElementById("g-age").textContent = state.age+" 岁";
  document.getElementById("g-day").textContent = "每点 1 年出 1 事";
  document.getElementById("g-phase").textContent = {child:"童年",teen:"少年",young:"青年",middle:"中年",old:"老年"}[state.phase];
  document.getElementById("gb-yanzhi").textContent = state.attrs.yanzhi;
  document.getElementById("gb-zhili").textContent = state.attrs.zhili;
  document.getElementById("gb-tizhi").textContent = state.attrs.tizhi;
  document.getElementById("gb-jiajing").textContent = state.attrs.jiajing;
}

// ========== 死亡结算 ==========
function showDeathReport(){
  const panel = document.getElementById("death-panel");
  panel.style.display = "block";
  document.getElementById("event-choice").style.display = "none";

  const age = state.age;
  const a = state.attrs;

  // 人生标签
  function tagText(val,name){
    if(name==="yanzhi"){
      if(val>=8) return "长得挺好看，就是没用";
      if(val>=5) return "普通长相，但活得体面";
      if(val>=3) return "长相一般，不影响吃饭";
      return "长得磕碜，但心不坏";
    }
    if(name==="zhili"){
      if(val>=8) return "一辈子都在想为什么";
      if(val>=5) return "脑子够用，没浪费";
      if(val>=3) return "普通智商，活得踏实";
      return "一辈子没想过为什么";
    }
    if(name==="tizhi"){
      if(val>=8) return "活到最后，身体比儿子还好";
      if(val>=5) return "身体还行，没少生病";
      if(val>=3) return "老毛病一堆，但没倒下";
      return "身体垮得早，但撑到了现在";
    }
    if(name==="jiajing"){
      if(val>=8) return "富了一辈子，没缺过钱";
      if(val>=5) return "小康一生，有房贷但还行";
      if(val>=3) return "温饱，饿不着";
      return "穷了一辈子，但没欠别人钱";
    }
  }

  const tags = [
    `<div class="dr-tag"><span class="dt-key">颜值 ${a.yanzhi}</span><span class="dt-val">${tagText(a.yanzhi,"yanzhi")}</span></div>`,
    `<div class="dr-tag"><span class="dt-key">智力 ${a.zhili}</span><span class="dt-val">${tagText(a.zhili,"zhili")}</span></div>`,
    `<div class="dr-tag"><span class="dt-key">体质 ${a.tizhi}</span><span class="dt-val">${tagText(a.tizhi,"tizhi")}</span></div>`,
    `<div class="dr-tag"><span class="dt-key">家境 ${a.jiajing}</span><span class="dt-val">${tagText(a.jiajing,"jiajing")}</span></div>`,
  ];

  // 人生回顾（随机挑3~5个）
  const recalls = state.keyEvents.sort(()=>Math.random()-0.5).slice(0,Math.min(5,state.keyEvents.length));
  const recallHtml = recalls.map(r=>`<div class="dr-recall-item">${r.age} 岁那年，${r.text}</div>`).join("");

  // 遗憾
  const remorseText = state.remorse>0 ? `你一共欠了 ${state.remorse} 件事，没说出口的话，没来得及的告别。` : "没什么遗憾，挺好的。";

  // 彴约评分（0~100）
  const attrScore = a.yanzhi*0.5 + a.zhili*1.5 + a.tizhi*1.0 + a.jiajing*0.5; // 0~40
  const ageScore = Math.min(age,80)/80*30; // 0~30
  const remorseScore = state.remorse===0 ? 20 : Math.max(0, 20-state.remorse*4); // 0~20
  const eventScore = Math.min(state.eventLog.length,20)*0.5; // 0~10
  const score = Math.min(100, Math.round(attrScore + ageScore + remorseScore + eventScore));

  panel.innerHTML = `
    <div class="death-report">
      <div style="font-size:14px;color:var(--dim)">彴约 · 流星划过</div>
      <div class="dr-age">享年 ${age} 岁</div>
      <div class="dr-tags">${标签.join("")}</div>
      <div class="dr-recall">${recallHtml}</div>
      <div class="dr-remorse">${remorseText}</div>
      <div class="dr-score">${score}</div>
      <div class="dr-score-label">彴约评分 · 短暂，但灿烂</div>
      <button class="btn btn-primary" style="margin-top:20px" onclick="restart()">再活一次</button>
    </div>
  `;

  document.getElementById("event-log").scrollTop = document.getElementById("event-log").scrollHeight;
}

function restart(){
  state = {
    mode:"custom", selectedTalents:[], randomTalentRefresh:null,
    confirmedRandomTalents:false, confirmedRandomAttrs:false,
    attrs:{yanzhi:0,zhili:0,tizhi:0,jiajing:0}, attrPointsUsed:0,
    origin:null, wealthLevel:null, month:0, age:0, phase:"child",
    autoPlay:false, speed:1, autoTimer:null, fastForward:false,
    pendingEvent:null, eventLog:[],
    keyEvents:[], remorse:0, gameOver:false, deathDay:0,
  };
  document.getElementById("death-panel").style.display = "none";
  document.getElementById("event-log").innerHTML = "";
  document.getElementById("event-choice").style.display = "none";
  document.getElementById("btn-next").disabled = false;
  document.getElementById("btn-skip").disabled = false;
  document.getElementById("btn-play").textContent = "▶ 自动";
  document.getElementById("btn-play").classList.remove("btn-primary");
  document.getElementById("panel-game").classList.remove("active");
  document.getElementById("panel-start").classList.add("active");
  document.querySelectorAll(".origin-item").forEach(e=>e.classList.remove("selected"));
  document.getElementById("wealth-preview").style.display = "none";
  document.getElementById("val-yanzhi").textContent = "0";
  document.getElementById("val-zhili").textContent = "0";
  document.getElementById("val-tizhi").textContent = "0";
  document.getElementById("val-jiajing").textContent = "0";
  document.getElementById("rd-items").innerHTML = '<span style="color:var(--dim);font-size:13px">尚未刷新</span>';
  document.getElementById("ra-items").innerHTML = '<span style="color:var(--dim);font-size:13px">尚未分配</span>';
  document.getElementById("btn-confirm-talents").disabled = true;
  document.getElementById("btn-confirm-attrs").disabled = true;
  document.getElementById("selected-talents-info").textContent = "";
  document.querySelectorAll(".talent-item").forEach(e=>e.classList.remove("selected"));
  document.getElementById("points-left").textContent = "20";
  checkStartReady();
  switchMode("custom");
}

init();
</script>
